[project]
name = "gittoken"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "loguru>=0.7.3",
    "sentry-sdk>=2.73.0",
    "opentelemetry-sdk>=1.0",
    "opentelemetry-exporter-otlp-proto-http>=1.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "jinja2>=3.1",
    "pillow>=11",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"
