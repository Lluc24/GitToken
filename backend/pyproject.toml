[project]
name = "gittoken"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "loguru>=0.7.3",
    "sentry-sdk>=2.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"
