{% set width = 360 %}
{% set padding = 20 %}
{% set track = width - 2 * padding - 8 %}
{% set rows_top = 82 %}
{% set row_height = 34 %}
{% set more_height = 18 if hidden_agent_count else 0 %}
{% set height = rows_top + rows|length * row_height + more_height + padding %}
{% set font = "-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif" %}
{% set mono = "'SF Mono', ui-monospace, Menlo, monospace" %}
{% set tints = {
  "common": ("#7aa2ff", "#9be7ff", "#c7d2fe"),
  "rare": ("#ff9f43", "#ff5e7e", "#ffd166"),
  "epic": ("#b26bff", "#5b8cff", "#ff7ae0"),
  "legendary": ("#22d3ee", "#e879f9", "#fcd34d"),
  "champion": ("#f5c542", "#ff8a3d", "#fff1a8"),
} %}
{% set tint = tints[rarity] %}
{% set aria = login ~ ": " ~ "{:,}".format(total_tokens) ~ " estimated tokens" %}
<svg xmlns="http://www.w3.org/2000/svg" width="{{ width }}" height="{{ height }}" viewBox="0 0 {{ width }} {{ height }}" role="img" aria-label="{{ aria }}">
  <title>{{ aria }}</title>
  <defs>
    <clipPath id="card"><rect width="{{ width }}" height="{{ height }}" rx="24"/></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="32"/></filter>
    <filter id="glow" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="3"/></filter>
    <linearGradient id="rim" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="{{ tint[0] }}"/>
      <stop offset="1" stop-color="{{ tint[1] }}"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#card)">
    <rect width="{{ width }}" height="{{ height }}" fill="#0a0d1f"/>
    <g filter="url(#blur)" opacity="0.85">
      <circle cx="40" cy="20" r="90" fill="{{ tint[0] }}"/>
      <circle cx="{{ width - 30 }}" cy="{{ height * 0.45 }}" r="80" fill="{{ tint[1] }}"/>
      <circle cx="{{ width * 0.45 }}" cy="{{ height + 20 }}" r="70" fill="{{ tint[2] }}"/>
    </g>
    <rect x="8" y="8" width="{{ width - 16 }}" height="{{ height - 16 }}" rx="18" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="8" y="8" width="{{ width - 16 }}" height="{{ (height - 16) / 2 }}" rx="18" fill="url(#sheen)"/>
    <rect x="8.5" y="8.5" width="{{ width - 17 }}" height="{{ height - 17 }}" rx="17.5" fill="none" stroke="url(#rim)"/>
  </g>
  <rect x="0.5" y="0.5" width="{{ width - 1 }}" height="{{ height - 1 }}" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity="0.18"/>
  <text x="{{ padding + 4 }}" y="{{ padding + 22 }}" fill="#ffffff" font-family="{{ font }}" font-size="18" font-weight="700" letter-spacing="-0.3">{{ login }}</text>
  <text x="{{ padding + 4 }}" y="{{ padding + 40 }}" fill="#ffffff" fill-opacity="0.7" font-family="{{ font }}" font-size="11.5">{{ rarity | capitalize }} · {{ "{:,}".format(total_tokens) }} estimated tokens</text>
  <rect x="{{ width - padding - 84 }}" y="{{ padding + 4 }}" width="84" height="30" rx="15" fill="#ffffff" fill-opacity="0.14" stroke="url(#rim)"/>
  <text x="{{ width - padding - 42 }}" y="{{ padding + 24 }}" text-anchor="middle" fill="#ffffff" font-family="{{ font }}" font-size="15" font-weight="700">{{ total_tokens | compact_tokens }}</text>
{% for row in rows %}
{% set top = rows_top + loop.index0 * row_height %}
{% set bar_width = [6, (track * row.share) | round | int] | max if total_tokens else 0 %}
  <g transform="translate({{ padding + 4 }} {{ top }})">
    {% include "marks/" ~ row.agent ~ ".svg" ignore missing %}
  </g>
  <text x="{{ padding + 26 }}" y="{{ top + 12 }}" fill="#ffffff" font-family="{{ font }}" font-size="12.5" font-weight="500">{{ row.name }}</text>
  <text x="{{ width - padding - 4 }}" y="{{ top + 12 }}" text-anchor="end" fill="#ffffff" fill-opacity="0.85" font-family="{{ mono }}" font-size="11.5">{{ row.tokens | compact_tokens }} · {{ row.percent }}%</text>
  <rect x="{{ padding + 4 }}" y="{{ top + 19 }}" width="{{ track }}" height="6" rx="3" fill="#ffffff" fill-opacity="0.12"/>
  <rect x="{{ padding + 4 }}" y="{{ top + 19 }}" width="{{ bar_width }}" height="6" rx="3" fill="url(#bar)" filter="url(#glow)" opacity="0.8"/>
  <rect x="{{ padding + 4 }}" y="{{ top + 19 }}" width="{{ bar_width }}" height="6" rx="3" fill="url(#bar)"/>
{% endfor %}
{% if hidden_agent_count %}
  <text x="{{ padding + 4 }}" y="{{ rows_top + rows|length * row_height + 4 }}" fill="#ffffff" fill-opacity="0.6" font-family="{{ font }}" font-size="11">+{{ hidden_agent_count }} more agents</text>
{% endif %}
</svg>
