[tool.uv.workspace]
members = ["backend", "infra"]

[dependency-groups]
dev = ["ruff>=0.16.10", "mypy>=1.18"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "ARG", "PTH",
  "RUF", "ANN", "BLE", "ERA", "FBT", "TRY", "PL", "S",
]
# E501: the formatter owns line length. TRY003: boundary errors must name expected vs received.
ignore = ["E501", "TRY003"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.vercel]
entrypoint = "backend.src.gittoken.api:app"

[tool.vercel.scripts]
build = "cd frontend && pnpm install --frozen-lockfile && pnpm build"
